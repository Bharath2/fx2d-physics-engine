name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: format + cppcheck + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format clang-tidy cppcheck \
            libeigen3-dev libyaml-cpp-dev

      - name: clang-format
        run: ./scripts/format.sh --check

      - name: cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c++20 \
            --language=c++ \
            --inline-suppr \
            --suppressions-list=scripts/cppcheck-suppressions.txt \
            --error-exitcode=1 \
            --quiet \
            -I include \
            src tests examples

      - name: clang-tidy (physics core)
        run: |
          ./scripts/gen_lint_compile_db.sh build-lint
          clang-tidy -p build-lint --quiet \
            src/Entity.cpp \
            src/Scene.cpp \
            src/Collisions.cpp \
            src/Constraints.cpp \
            src/Joints.cpp \
            src/YamlUtils.cpp
